version: '3.8'

services:
  # FastAPI Backend
  api:
    build: .
    container_name: veritas-api
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - ./data:/app/data
      - veritas_db_data:/app/data/db
    environment:
      - DATABASE_URL=sqlite:///./veritas_finance.db
      - PYTHONUNBUFFERED=1
    command: python api/main.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Streamlit Dashboard
  dashboard:
    build: .
    container_name: veritas-dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./:/app
      - ./data:/app/data
      - veritas_db_data:/app/data/db
    environment:
      - DATABASE_URL=sqlite:///./veritas_finance.db
      - PYTHONUNBUFFERED=1
    command: streamlit run dashboard.py --server.port=8501 --server.address=0.0.0.0
    depends_on:
      - api
    restart: unless-stopped

  # PostgreSQL Database (Optional - for production)
  # Uncomment if you want to use PostgreSQL instead of SQLite
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: veritas-postgres
  #   environment:
  #     - POSTGRES_DB=veritas
  #     - POSTGRES_USER=veritas
  #     - POSTGRES_PASSWORD=veritas_password
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   restart: unless-stopped

volumes:
  veritas_db_data:
  # postgres_data:  # Uncomment if using PostgreSQL
